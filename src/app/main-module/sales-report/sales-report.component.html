<div class="min-h-screen p-6 ">
      <!-- Header -->
      <div class="flex justify-between items-center mb-8">
            <h1 class="text-2xl font-bold text-gray-800">Sales Report</h1>
      </div>

      <!-- Stats Cards -->
      <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8">
            <div class="p-3 bg-white shadow rounded-lg w-full">
                  <h2 class="text-xl font-semibold mb-4">Pie Chart</h2>
                  <div class="flex justify-around items-center flex-wrap">
                        <div class="text-center relative">
                              <canvas id="TotalOrder" width="150" height="150"></canvas>
                              <p class="mt-4 text-3xl font-bold text-gray-800 absolute top-1/4 left-1/3">{{ TotalOrder
                                    }}%
                              </p>
                              <span class="text-sm font-medium text-[#252525]">Total Order</span>
                        </div>
                        <div class="text-center relative">
                              <canvas id="CustomerGrowth" width="150" height="150"></canvas>
                              <p class="mt-4 text-3xl font-bold text-gray-800 absolute top-1/4 left-1/3">{{
                                    CustomerGrowth }}%
                              </p>
                              <span class="text-sm font-medium text-[#252525]">Customer Growth</span>
                        </div>
                        <div class="text-center relative">
                              <canvas id="TotalRevenue" width="150" height="150"></canvas>
                              <p class="mt-4 text-3xl font-bold text-gray-800 absolute top-1/4 left-1/3">{{ TotalRevenue
                                    }}%
                              </p>
                              <span class="text-sm font-medium text-[#252525]">Total Revenue</span>
                        </div>
                  </div>
            </div>
            <div class="p-3 bg-white shadow rounded-lg w-full">
                  <div class="flex justify-between items-center w-full">
                        <h2 class="text-xl font-semibold mb-4">Chart Order</h2>
                        <button
                              class="px-2 py-1 text-sm font-medium text-primary rounded border border-primary flex items-center gap-1 hover:bg-primary hover:text-white">
                              <svg xmlns="http://www.w3.org/2000/svg" width="1.5em" height="1.5em" viewBox="0 0 24 24">
                                    <path fill="currentColor"
                                          d="M12 15.575q-.2 0-.375-.062T11.3 15.3l-3.6-3.6q-.3-.3-.288-.7t.288-.7q.3-.3.713-.312t.712.287L11 12.15V5q0-.425.288-.712T12 4t.713.288T13 5v7.15l1.875-1.875q.3-.3.713-.288t.712.313q.275.3.288.7t-.288.7l-3.6 3.6q-.15.15-.325.213t-.375.062M6 20q-.825 0-1.412-.587T4 18v-2q0-.425.288-.712T5 15t.713.288T6 16v2h12v-2q0-.425.288-.712T19 15t.713.288T20 16v2q0 .825-.587 1.413T18 20z" />
                              </svg>
                              Save Report
                        </button>
                  </div>
                  <canvas id="OrderChart"></canvas>
            </div>
      </div>
      <div class="gap-6 grid grid-cols-1 md:grid-cols-6">
            <div class="w-full md:col-span-4">
                  <div class="p-6 bg-white shadow rounded-lg w-full">
                        <h2 class="text-xl font-semibold mb-4">Total Revenue</h2>
                        <canvas id="TotalRevenueChart" height="100"></canvas>
                  </div>
            </div>
            <div class="p-6 bg-white shadow rounded-lg w-full md:col-span-2">
                  <div class="flex justify-between">
                        <h2 class="text-xl font-semibold mb-4">Customer Map</h2>
                        <select class="border rounded px-2 py-0 text-xs outline-none h-6 text-primary">
                              <option>Weekly</option>
                              <option>Monthly</option>
                              <option>Yearly</option>
                        </select>
                  </div>
                  <canvas id="CustomerChart" height="220"></canvas>
            </div>
      </div>
</div>
